# Publishes server.json to the official MCP Registry when a version tag is
# pushed (e.g. v2.1.1). Signs in with GitHub Actions OIDC, so it publishes as
# the SocialAPIsHub org: no personal login, no org app installs.
#
# Release order: bump the version (package.json, server.json, plugin.json,
# lhm.plugin.json) → merge → npm publish → push the tag. The job waits for
# that version to appear on npm, because the registry checks the npm package.

name: Publish to MCP Registry

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  id-token: write # GitHub OIDC login to the registry
  contents: read

env:
  MCP_PUBLISHER_VERSION: v1.8.1

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches server.json
        if: github.event_name == 'push'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(jq -r .version server.json)"
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match server.json version $version" >&2
            exit 1
          fi

      - name: Wait for the version on npm
        run: |
          pkg="$(jq -r '.packages[0].identifier' server.json)"
          version="$(jq -r .version server.json)"
          for i in $(seq 1 30); do
            if [ "$(npm view "$pkg@$version" version 2>/dev/null)" = "$version" ]; then
              echo "$pkg@$version is on npm"
              exit 0
            fi
            echo "Waiting for $pkg@$version on npm ($i/30)"
            sleep 20
          done
          echo "$pkg@$version is not on npm. Run npm publish first." >&2
          exit 1

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --version || true

      - name: Log in to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish
